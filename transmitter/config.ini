# 发射端唯一配置文件（UTF-8）。先填写中心频率、摄像头名称和天线端口。
backend=usrp
device_args=addr=192.168.10.2
# 两端相同；0表示尚未配置，程序会拒绝启动。
frequency_hz=0
sample_rate=10000000
gain_db=0
antenna=
channel=0
# 0：持续运行，按Ctrl+C停止。
duration_seconds=0

# 在此电脑执行 .\transmitter\list-cameras.ps1 后填写精确名称。
camera_name=
width=1280
height=720
fps=30
bitrate_mbps=3

# 一般不用改；程序内部在本机传递编码视频，不是两台PC直传视频。
video_port=5600
ffmpeg=ffmpeg
uhd_bin=C:\Program Files\UHD\bin
# 仅backend=udp_test使用；正式空口模式忽略此项。
test_link_address=127.0.0.1:19001
